<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070807">
<title>اکنون | منوی کافه</title>

<style>
:root{
  --black:#070807;
  --black2:#0d100e;
  --black3:#111512;
  --gold:#dca900;
  --gold2:#f5c431;
  --cream:#f4ead2;
  --muted:#aaa18d;
  --turq:#168c83;
  --line:rgba(220,169,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Tahoma,"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 0,rgba(220,169,0,.10),transparent 28%),
    linear-gradient(180deg,#050605,#0b0d0b 50%,#050605);
  color:var(--cream);
  line-height:1.9;
  overflow-x:hidden;
}
body:before{
  content:"";
  position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.09;
  background-image:
    linear-gradient(30deg,transparent 46%,#dca900 47%,#dca900 49%,transparent 50%),
    linear-gradient(150deg,transparent 46%,#dca900 47%,#dca900 49%,transparent 50%);
  background-size:52px 52px;
}
body:after{
  content:"";
  position:fixed;inset:10px;z-index:-1;pointer-events:none;
  border:1px solid rgba(220,169,0,.18);
  border-radius:18px;
}
.container{width:min(1120px,92%);margin:auto}

/* ---------- header ---------- */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(5,7,6,.92);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(220,169,0,.28);
}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--gold2);font-weight:900}
.brand img{
  width:52px;height:52px;object-fit:cover;border-radius:50%;
  border:2px solid var(--gold);box-shadow:0 0 20px rgba(220,169,0,.15)
}
.navlinks{display:flex;gap:8px}
.navlinks a{color:#ded7c7;text-decoration:none;padding:7px 14px}
.navlinks a:hover{color:var(--gold2)}

/* ---------- Iranian ornament ---------- */
.iranian-line{
  height:16px;position:relative;margin:20px auto;max-width:650px;
}
.iranian-line:before,.iranian-line:after{
  content:"";position:absolute;top:7px;height:1px;width:43%;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.iranian-line:before{right:0}.iranian-line:after{left:0}
.iranian-line span{
  position:absolute;left:50%;top:-2px;transform:translateX(-50%) rotate(45deg);
  width:17px;height:17px;border:1px solid var(--gold);
}
.iranian-line span:after{
  content:"";position:absolute;inset:3px;border:1px solid var(--turq);
}

/* ---------- hero ---------- */
.hero{text-align:center;padding:44px 0 25px;position:relative}
.hero:before{
  content:"";position:absolute;left:50%;top:35px;transform:translateX(-50%);
  width:310px;height:190px;
  border:1px solid rgba(220,169,0,.12);
  border-bottom:0;border-radius:180px 180px 0 0;
  pointer-events:none;
}
.hero-logo{
  width:150px;height:150px;object-fit:cover;border-radius:50%;
  border:4px solid var(--gold);padding:3px;
  box-shadow:0 0 0 7px rgba(220,169,0,.06),0 0 45px rgba(220,169,0,.18);
  position:relative;
}
.hero h1{
  color:var(--gold2);font-size:clamp(2.4rem,8vw,4.2rem);
  line-height:1.2;margin-top:8px
}
.hero p{color:var(--muted);font-size:.95rem}

/* ---------- categories ---------- */
.categories{
  position:sticky;top:76px;z-index:90;
  background:rgba(7,8,7,.93);backdrop-filter:blur(14px);
  border-top:1px solid rgba(220,169,0,.12);
  border-bottom:1px solid rgba(220,169,0,.22);
  padding:11px 0;
}
.catbar{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.catbar::-webkit-scrollbar{display:none}
.cat{
  flex:0 0 auto;min-width:150px;padding:10px 17px;
  border:1px solid rgba(220,169,0,.42);border-radius:6px;
  background:#0b0d0b;color:#eee4cf;font-family:inherit;
  cursor:pointer;transition:.25s;position:relative;
}
.cat:before,.cat:after{
  content:"";position:absolute;width:6px;height:6px;border:1px solid var(--turq);
  transform:rotate(45deg);top:50%;
}
.cat:before{right:8px}.cat:after{left:8px}
.cat.active,.cat:hover{
  background:linear-gradient(135deg,#e0ab00,#b98200);
  color:#111;box-shadow:0 8px 25px rgba(220,169,0,.16);
}

/* ---------- sections ---------- */
.section{padding:48px 0 5px;scroll-margin-top:145px}
.section-head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.section-head .icon{
  width:52px;height:52px;border:1px solid var(--gold);
  display:grid;place-items:center;transform:rotate(45deg);
  background:#0b0e0c;border-radius:5px;flex:none
}
.section-head .icon span{transform:rotate(-45deg);font-size:1.6rem}
.section-head h2{color:var(--gold2);font-size:1.75rem}
.section-head small{color:var(--muted);font-size:.78rem}
.rule{height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--line))}
.rule:after{content:"◆";color:var(--turq);font-size:.7rem;margin-right:10px}

/* ---------- photo items ---------- */
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.photo-card{
  display:flex;gap:16px;padding:12px;
  background:linear-gradient(135deg,rgba(19,23,20,.96),rgba(8,10,9,.96));
  border:1px solid rgba(220,169,0,.28);
  border-radius:5px;box-shadow:0 18px 45px rgba(0,0,0,.35);
  position:relative;overflow:hidden;transition:.25s
}
.photo-card:before{
  content:"";position:absolute;inset:5px;border:1px solid rgba(22,140,131,.15);
  pointer-events:none
}
.photo-card:hover{transform:translateY(-3px);border-color:var(--gold)}
.photo{
  width:145px;height:145px;min-width:145px;object-fit:cover;
  border-radius:4px;border:2px solid var(--gold);
  background:linear-gradient(135deg,#292319,#0c0d0c)
}
.info{display:flex;flex-direction:column;justify-content:center;padding:5px}
.name{font-weight:900;color:#fff;font-size:1.08rem}
.desc{font-size:.76rem;color:var(--muted);line-height:1.9}
.price{color:var(--gold2);font-weight:900;margin-top:9px;white-space:nowrap}

/* ---------- no-photo items ---------- */
.simple-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:0 32px;
  background:rgba(12,15,13,.76);
  border:1px solid rgba(220,169,0,.25);border-radius:5px;
  padding:8px 25px;
}
.simple{
  display:grid;grid-template-columns:1fr auto;gap:14px;
  padding:17px 5px;border-bottom:1px solid rgba(255,255,255,.08);
  position:relative;
}
.simple:before{
  content:"◆";color:var(--turq);font-size:.55rem;
  position:absolute;right:-13px;top:25px;
}
.simple .price{margin:0;align-self:center}

/* ---------- footer ---------- */
.footer{
  margin-top:60px;padding:38px 0 24px;
  background:#050605;border-top:1px solid var(--line);
  position:relative
}
.footer:before{
  content:"❖  ◆  ❖  ◆  ❖  ◆  ❖  ◆  ❖";
  display:block;text-align:center;color:rgba(220,169,0,.35);
  letter-spacing:8px;margin-bottom:25px
}
.footer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;text-align:center}
.footer h3{color:var(--gold2);font-size:1rem}
.footer p{color:var(--muted);font-size:.8rem}
.share{
  display:block;margin:25px auto 0;padding:9px 22px;
  background:transparent;border:1px solid var(--gold);color:var(--gold2);
  border-radius:5px;font-family:inherit;cursor:pointer
}
.copy{text-align:center;color:#625f57;font-size:.7rem;margin-top:23px}

/* ---------- mobile ---------- */
@media(max-width:760px){
  .nav{height:65px}.brand img{width:46px;height:46px}
  .navlinks{display:none}.categories{top:65px}
  .hero{padding-top:35px}.hero:before{width:245px;height:155px}
  .hero-logo{width:125px;height:125px}
  .photo-grid,.simple-grid,.footer-grid{grid-template-columns:1fr}
  .photo{width:108px;min-width:108px;height:108px}
  .simple-grid{padding:6px 16px}
  .simple:last-child{border-bottom:0}
  .section{padding-top:38px}
}
@media(max-width:390px){
  .photo{width:94px;min-width:94px;height:94px}
  .photo-card{gap:10px;padding:9px}
  .name{font-size:.98rem}.desc{font-size:.7rem}
}
</style>
</head>

      {name:"چیزکیک",description:"کیک پنیر با سس مخصوص",price:"۱/۸۰۰/۰۰۰"},
      {name:"باقلوا",description:"براونی شکلاتی با بافت نرم",price:"۹۵۰/۰۰۰"},
      {name:"کیک خیس شکلاتی",description:"کیک تازه روز با تزئین مخصوص",price:"۱/۵۰۰/۰۰۰"},
      {name:"کارامل موس",description:"بستنی با سس و تاپینگ انتخابی",price:"۱/۸۰۰/۰۰۰"}
    ]
  }
};

const content=document.getElementById("menuContent");

function renderMenu(key){
  const d=menuData[key];
  const section=document.createElement("section");
  section.className="section";
  section.id=key;

  section.innerHTML=`
    <div class="section-head">
      <div class="icon"><span>${d.icon}</span></div>
      <div>
        <h2>${d.title}</h2>
        <small>${d.subtitle}</small>
      </div>
      <div class="rule"></div>
    </div>
    <div class="${d.photos?"photo-grid":"simple-grid"}"></div>
  `;

  const grid=section.querySelector(d.photos?".photo-grid":".simple-grid");

  d.items.forEach(item=>{
    if(d.photos){
      const card=document.createElement("article");
      card.className="photo-card";

      let photo=item.src
        ? `<img class="photo" src="${item.src}" alt="${item.name}">`
        : `<div class="photo" style="display:grid;place-items:center;text-align:center;color:#827d70;font-size:.7rem">📷<br>عکس این آیتم<br>اینجا قرار می‌گیرد</div>`;

      card.innerHTML=`
        ${photo}
        <div class="info">
          <div class="name">${item.name}</div>
          <div class="desc">${item.description}</div>
          <div class="price">${item.price} ریال</div>
        </div>
      `;
      grid.appendChild(card);
    }else{
      const row=document.createElement("article");
      row.className="simple";
      row.innerHTML=`
        <div>
          <div class="name">${item.name}</div>
          <div class="desc">${item.description}</div>
        </div>
        <div class="price">${item.price} ریال</div>
      `;
      grid.appendChild(row);
    }
  });

  content.appendChild(section);
}

Object.keys(menuData).forEach(renderMenu);

document.querySelectorAll(".cat").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".cat").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.target).scrollIntoView({
      behavior:"smooth",block:"start"
    });
  });
});

const observer=new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      document.querySelectorAll(".cat").forEach(btn=>{
        btn.classList.toggle(
          "active",
          btn.dataset.target===entry.target.id
        );
      });
    }
  });
},{rootMargin:"-25% 0px -65% 0px"});

Object.keys(menuData).forEach(k=>{
  observer.observe(document.getElementById(k));
});

async function shareMenu(){
  try{
    if(navigator.share){
      await navigator.share({
        title:"منوی کافه اکنون",
        text:"منوی دیجیتال کافه اکنون",
        url:location.href
      });
    }else{
      await navigator.clipboard.writeText(location.href);
      alert("لینک منو کپی شد.");
    }
  }catch(e){}
}
</script>
